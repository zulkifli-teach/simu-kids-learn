[build]
  command = "bun run build"
  # Nitro's Netlify preset writes static assets to dist/ and the SSR
  # function to .netlify/functions-internal/ (picked up automatically).
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  BUN_VERSION = "1.3.12"
  # The Lovable Vite config defaults Nitro to Cloudflare; build for Netlify instead.
  NITRO_PRESET = "netlify"
